apiVersion: cronos.dev/v1
kind: Dataset
metadata:
  name: invoices
  description: Issued invoices with customer detail, scoped to the caller's tenant.
spec:
  sources:
    - ref: warehouse

  query: |
    SELECT i.id,
           i.customer_id,
           c.name AS customer_name,
           i.issued_at,
           i.currency,
           i.total_cents / 100.0 AS total,
           i.status
    FROM warehouse.invoices i
    JOIN warehouse.customers c ON c.id = i.customer_id
    WHERE i.issued_at BETWEEN {{ .params.from }} AND {{ .params.to }}
      AND i.status = ANY({{ .params.status }})

  params:
    - name: from
      type: date
      required: true
      label: From
    - name: to
      type: date
      required: true
      default: today
      label: To
    - name: status
      type: enum
      values: [draft, sent, paid, overdue]
      multiple: true
      default: [sent, paid, overdue]
      label: Status
    - name: customer_id
      type: string
      required: false
      label: Customer

  fields:
    - {name: id,            type: string,  role: dimension, hidden: true}
    - {name: customer_id,   type: string,  role: dimension, hidden: true}
    - {name: customer_name, type: string,  role: dimension, label: Customer}
    - {name: issued_at,     type: date,    role: dimension, label: Issued}
    - {name: status,        type: string,  role: dimension, label: Status}
    - name: total
      type: decimal
      role: measure
      aggregate: sum
      label: Amount
      format: currency
      currencyField: currency

  # Row scope comes from the caller's embed token. Project isolation is
  # structural and needs no predicate here — see docs/tenancy.md.
  rowLevelSecurity:
    - predicate: customer_id = {{ .scope.customer_id }}
