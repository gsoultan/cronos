# Cuts a release from a tag: archives, Linux packages, SBOMs, a signature.
#
# Until this existed, a release was `make dist` on somebody's laptop and an
# upload. That is two problems rather than one. The archives were built on a
# machine nobody else can inspect, so "this tarball came from that tag" rested
# on trusting whoever ran the command; and there was nothing to check a
# download against beyond a SHA256SUMS file published next to the thing it
# describes, which an attacker who can replace one can replace both.
#
# Here the build happens where the log is public, the SBOM is generated from
# the binaries that actually shipped, and SHA256SUMS is signed by the workflow's
# own identity rather than by a key somebody has to keep.
#
# What runs it is goreleaser, against .goreleaser.yaml. The rule that file has
# to keep is the licence boundary — two archives, each carrying the LICENSE that
# covers the binary beside it — and scripts/check-release-parity.sh holds it
# from the other side.
name: release

# Tags only. check.yml runs on branches and deliberately not on tags, so the
# suite does not run twice against the same commit — which means the tag being
# built here has already been through it on the branch it came from.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    permissions:
      # To create the release and attach the artifacts.
      contents: write
      # To mint the OIDC token cosign signs with. This is the whole reason there
      # is no signing key in this repository: the identity being attested is
      # "the release workflow of this repository at this tag", which is
      # checkable by anyone and cannot be stolen from a password manager.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser derives the version from the tag and refuses a shallow
          # clone that cannot see it.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A tag on a commit whose CHANGELOG says nothing about it is a version an
      # operator can read off `cronosd -version` and then not look up. `make
      # release` checks this locally and nothing enforced it, so the check that
      # mattered was the one somebody could skip by tagging directly.
      - name: the changelog names this version
        run: |
          version="${GITHUB_REF_NAME}"
          grep -q "^## ${version} " CHANGELOG.md || {
            echo "CHANGELOG.md has no '## ${version}' entry."
            echo "A release an operator cannot look up is not a release."
            exit 1
          }

      # The licence boundary, in the artifacts rather than only in the build
      # graph. Checked before anything is built, so a config that would ship
      # cronosd-ee beside the community binaries fails in ten seconds rather
      # than after a five-minute cross-compile.
      - name: release parity
        run: ./scripts/check-release-parity.sh

      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Verified here rather than trusted, because a signature nobody has
      # checked is a file. This is the same command the documentation gives a
      # person downloading a release, run against the artifacts before anybody
      # can download them — so the instructions are known to work at the moment
      # they are published rather than the first time somebody follows them.
      - name: verify what was published
        run: |
          cosign verify-blob \
            --bundle dist/SHA256SUMS.cosign.bundle \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

          # And that an SBOM was actually catalogued. syft exits 0 having
          # written an empty file when it cannot read a source, which is the
          # failure scripts/sbom.sh exists to refuse — this is the second pair
          # of eyes on it, at the only moment it still matters.
          for f in dist/*.spdx.json; do
            grep -q '"packages"' "$f" || { echo "$f catalogued nothing"; exit 1; }
          done
