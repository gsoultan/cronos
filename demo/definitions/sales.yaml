apiVersion: cronos.dev/v1
kind: Dataset
metadata:
  name: sales
  title: Sales orders
  description: Every order Trailhead Outfitters took this year, with what it cost to make.
spec:
  sources:
    - ref: warehouse
  query: |
    SELECT id, ordered_at, region, channel, category, rep,
           units, revenue, cost, revenue - cost AS margin
    FROM sales_orders
  fields:
    - {name: id,         type: number,  role: dimension, hidden: true}
    - {name: ordered_at, type: date,    role: dimension, label: Ordered}
    - {name: region,     type: string,  role: dimension, label: Region}
    - {name: channel,    type: string,  role: dimension, label: Channel}
    - {name: category,   type: string,  role: dimension, label: Category}
    - {name: rep,        type: string,  role: dimension, label: Account manager}
    - {name: units,      type: number,  role: measure, aggregate: sum, label: Units}
    - {name: revenue,    type: decimal, role: measure, aggregate: sum, label: Revenue, format: currency, currency: USD}
    - {name: cost,       type: decimal, role: measure, aggregate: sum, label: Cost of goods, format: currency, currency: USD}
    - {name: margin,     type: decimal, role: measure, aggregate: sum, label: Gross margin, format: currency, currency: USD}
