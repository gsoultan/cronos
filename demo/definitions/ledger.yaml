apiVersion: cronos.dev/v1
kind: Dataset
metadata:
  name: ledger
  title: Management P&L
  description: The general ledger summarised to P&L lines, a row per month, line and department, against budget.
spec:
  sources:
    - ref: warehouse
  # Signed, the way a ledger is: revenue positive and every cost negative, so
  # a line's sum is what it did to profit and the sum of everything is the
  # operating profit. Spend is the same costs as positive numbers, for the
  # charts that compare them with each other rather than with revenue.
  query: |
    SELECT period, line_no, line, department, actual, budget,
           actual - budget AS variance,
           CASE WHEN line_no >= 3 THEN -actual END AS spend,
           CASE WHEN line_no >= 3 THEN -budget END AS spend_budget,
           CASE WHEN line_no = 1 THEN actual END AS revenue,
           CASE WHEN line_no = 1 THEN budget END AS revenue_budget
    FROM gl_lines
  fields:
    - {name: period,         type: date,    role: dimension, label: Month}
    - {name: line_no,        type: number,  role: dimension, hidden: true}
    - {name: line,           type: string,  role: dimension, label: Line}
    - {name: department,     type: string,  role: dimension, label: Department}
    - {name: actual,         type: decimal, role: measure, aggregate: sum, label: Actual, format: currency, currency: USD}
    - {name: budget,         type: decimal, role: measure, aggregate: sum, label: Budget, format: currency, currency: USD}
    - {name: variance,       type: decimal, role: measure, aggregate: sum, label: Variance, format: currency, currency: USD}
    - {name: spend,          type: decimal, role: measure, aggregate: sum, label: Spend, format: currency, currency: USD}
    - {name: spend_budget,   type: decimal, role: measure, aggregate: sum, label: Spend budget, format: currency, currency: USD}
    - {name: revenue,        type: decimal, role: measure, aggregate: sum, label: Revenue, format: currency, currency: USD}
    - {name: revenue_budget, type: decimal, role: measure, aggregate: sum, label: Revenue budget, format: currency, currency: USD}
